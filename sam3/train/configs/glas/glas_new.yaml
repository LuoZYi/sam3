# glas_stable.yaml
# 目标：GlaS 小数据稳定训练（不 NaN、val 有意义、只训 head）
# 关键改动：
# - 关闭 use_presence（避免 triton sigmoid focal reduce NaN）
# - val 不 include_negatives（否则很容易 val loss 恒 0）
# - o2m_weight=0（GlaS 不需要 one-to-many）
# - backbone lr=0（只训 head）

# @package _global_
defaults:
  - _self_

# ======================================================================
# Paths (EDIT THESE)
# ======================================================================
paths:
  glas_root: /home/path_sam3/pipeline/datasets/Glas_org
  glas_coco_root: /home/path_sam3/pipeline/generated_coco/GlaS
  experiment_log_dir: /home/path_sam3/pipeline/experiments/glas_head
  bpe_path: /home/path_sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz

# ======================================================================
# Transforms
# ======================================================================
glas:
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        # 先过滤空 target（避免 downstream loss 出奇怪值）
        - _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets

        # 给输入 box 加噪声（SAM 风格）
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20

        # 训练可以随机 resize
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: false

        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: false

        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI

        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: [0.5, 0.5, 0.5]
          std:  [0.5, 0.5, 0.5]

  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        # 验证不要随机（consistent_transform=true）
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: true

        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI

        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: [0.5, 0.5, 0.5]
          std:  [0.5, 0.5, 0.5]

  # ======================================================================
  # Loss
  # ======================================================================
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}

    # GlaS：先稳定，先不用 O2M
    o2m_weight: 0.0
    use_o2m_matcher_on_o2m_aux: false

    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0

      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        # ⭐关键：关闭 presence，避免触发 triton sigmoid focal reduce 的 NaN
        use_presence: false
        # 保持最朴素稳定的 BCE（pos_focal=false）
        pos_focal: false
        weight_dict:
          loss_ce: 20.0
        pos_weight: 5.0
        alpha: 0.25
        gamma: 2.0

    loss_fn_semantic_seg: null
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ======================================================================
# Scratch (small dataset stable settings)
# ======================================================================
scratch:
  enable_segmentation: false
  d_model: 256

  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2.0
    stable: false

  scale_by_find_batch_size: true

  resolution: 1008
  max_ann_per_img: 200

  num_train_workers: 4
  num_val_workers: 2

  max_data_epochs: 60
  target_epoch_size: 300
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # LR: only head
  head_lr: 5e-5
  lr_transformer: ${scratch.head_lr}
  lr_vision_backbone: 0.0
  lr_language_backbone: 0.0

  lrd_vision_backbone: 0.9

  wd: 0.15

  scheduler_timescale: 200
  scheduler_warmup: 200
  scheduler_cooldown: 200

  train_batch_size: 1
  val_batch_size: 1
  gradient_accumulation_steps: 1

  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation}

  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: glas
    with_seg_masks: ${scratch.enable_segmentation}

# ======================================================================
# Trainer
# ======================================================================
trainer:
  _target_: sam3.train.trainer.Trainer

  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: true
  skip_first_val: false

  max_epochs: ${scratch.max_data_epochs}
  accelerator: cuda
  seed_value: 123

  val_epoch_freq: 2

  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: true
    gradient_as_bucket_view: true

  loss:
    all: ${glas.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        transforms: ${glas.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: false
        img_folder: ${paths.glas_root}/train/images
        ann_file: ${paths.glas_coco_root}/train_glas.coco.json

      shuffle: true
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: true
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        # ⭐不要 include_negatives（你之前 val 全 0 的大头来源之一）
        img_folder: ${paths.glas_root}/val/images
        ann_file: ${paths.glas_coco_root}/val_glas.coco.json
        transforms: ${glas.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false
        use_caching: false

      shuffle: false
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: true
      drop_last: false
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}

  meters: null

  optim:
    amp:
      enabled: false
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: true
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        # HEAD / TRANSFORMER
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}

        # VISION BACKBONE (FROZEN)
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'

        # LANGUAGE BACKBONE (FROZEN)
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: true
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10
    log_scalar_frequency: 20

# ======================================================================
# Launcher
# ======================================================================
launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 24
  use_cluster: false
  cpus_per_task: 4
  port_range: [10000, 65000]
  constraint: null


